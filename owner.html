<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#075e54" />
  <title>BoarDog — אפליקציית הפנסיון</title>
  <link rel="stylesheet" href="assets/css/app.css" />
</head>
<body class="owner-body">
  <div class="owner">
    <header class="owner-head">
      <div>
        <div class="oh-title">🏠 אפליקציית הפנסיון</div>
        <div class="oh-sub" id="oh-sub"></div>
      </div>
      <a class="oh-link" href="index.html">💬 צ'אט הלקוח</a>
    </header>

    <nav class="otabs" id="otabs">
      <button class="otab on" data-otab="cal">📅 יומן</button>
      <button class="otab" data-otab="avail">🕒 זמינות</button>
      <button class="otab" data-otab="ask">🤖 שאל AI</button>
    </nav>

    <main class="owner-main">
      <!-- יומן -->
      <section class="opanel" data-panel="cal">
        <div class="cal-nav">
          <button id="cal-prev">‹</button>
          <div id="cal-month"></div>
          <button id="cal-next">›</button>
        </div>
        <div class="ocal-grid" id="ocal-grid"></div>
        <div class="cal-legend"><span>📋 פגישת היכרות</span><span>🏠 שהייה</span></div>
        <div class="day-detail" id="day-detail"></div>
      </section>

      <!-- זמינות -->
      <section class="opanel" data-panel="avail" hidden>
        <p class="opanel-hint">בחר/י אילו ימים ושעות פנויים לפגישות היכרות (חוזר בכל שבוע). הלקוחות יראו רק את המועדים האלה.</p>
        <div id="avail-grid"></div>
        <button class="save-btn" id="save-avail">שמור זמינות</button>
      </section>

      <!-- שאל AI -->
      <section class="opanel" data-panel="ask" hidden>
        <p class="opanel-hint">כמה כלבים יהיו בפנסיון בתקופה מסוימת?</p>
        <div class="ask-range">
          <label>מ־ <input type="date" id="ask-from"></label>
          <label>עד <input type="date" id="ask-to"></label>
          <button class="save-btn" id="ask-go">בדוק</button>
        </div>
        <div class="ask-result" id="ask-result"></div>
        <div class="ask-ai">
          <div class="opanel-hint">או שאל/י בשפה חופשית (דורש מצב AI מופעל בצ'אט הלקוח):</div>
          <div class="ask-ai-row">
            <input type="text" id="ask-text" placeholder="לדוגמה: כמה כלבים בין 5 ל-10 בחודש?" />
            <button class="save-btn" id="ask-ai-go">שאל</button>
          </div>
          <div class="ask-result" id="ask-ai-result"></div>
        </div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/cloud.js"></script>
  <script src="assets/js/owner.js"></script>
</body>
</html>
